[project]
name = "aw-watcher-orca"
version = "0.1.0"
description = "Orca worktree attribution core and read-only state probe"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
pythonpath = [".", "tests", "../tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = [".", "../tools", "tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint]
select = ["B", "D", "E4", "E7", "E9", "E501", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102", "D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["aw_watcher_orca", "../tools", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.mypy]
disallow_untyped_defs = true
files = ["aw_watcher_orca", "../tools", "tests"]
ignore_missing_imports = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
